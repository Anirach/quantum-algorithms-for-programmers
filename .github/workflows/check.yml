name: Quantum companion checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python foundations.py
      - run: python grover_search.py
      - run: python shor_factor15.py
      - run: python hhl_2x2.py
      - run: python qaoa_maxcut.py
      - run: python quantum_simulation.py
      - run: python engineering_scorecard.py
